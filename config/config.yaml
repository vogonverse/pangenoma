# config/config.yaml
# Configuración del Pipeline PanForest
# ====================================================

# ============================================
# ARCHIVOS DE ENTRADA
# ============================================
input:
  # Matriz de presencia/ausencia de genes (se genera automáticamente con Panaroo)
  gene_presence_absence: "results/panaroo/gene_presence_absence.csv"

  # Filogenia (requerida solo si phylogeny.skip = false)
  phylogeny: null  # "results/phylogeny/strain_phylogeny.tree" .nwk 

# ============================================
# DESCARGA DE GENOMAS
# ============================================
download:
  organism: "Escherichia coli"  # Solo documentación
  taxid: "562"                  # NCBI Taxonomy ID 

  # Niveles de ensamblaje a descargar
  # Opciones: complete, chromosome, scaffold, contig
  assembly_levels:
    - "complete"
  


  # Directorio de salida
  outdir: "data/raw/genomes"

  # Opcional: limitar número de genomas (testing)
  max_genomes: 100  # Descomentar para limitar

# ============================================
# ANOTACIÓN CON PROKKA
# ============================================
prokka:
  genus: "Escherichia"
  species: "coli"
  kingdom: "Bacteria"
  threads: 2
  mem_mb: 4000

# ============================================
# PANAROO - Inferencia del pangenoma
# ============================================
panaroo:
  # Modo de limpieza (el único modo que usa Panaroo)
  clean_mode: "sensitive"       # strict, moderate, sensitive (paper:sensitive)

  # Clustering de genes
  identity_threshold: 0.95      # % identidad para agrupar genes
  family_threshold: 0.7         # Threshold para clustering de familias
  len_dif_percent: 0.98         # Cutoff de diferencia de longitud

  # Core genome
  core_threshold: 0.95          # % genomas para considerar gen core(paper:95%)

  # Alineamiento
  alignment: "core"             # core, pan, o null (no alinear)
  aligner: "mafft"              # mafft, clustal, prank

  # Opciones avanzadas
  remove_invalid_genes: true    # Eliminar genes con anotaciones no validas
  merge_paralogs: false         # Fusionar parálogos en un solo cluster

  # Recursos
  threads: 32                   # Máxima paralelización (optimizado de 8 a 32)

# ============================================
# PREPROCESAMIENTO
# ============================================
preprocessing:
  roary_format: false           # true si input viene de Roary (vs Panaroo)

  # Filtros de genes (según paper)
  min_presence_percent: 1.0     # Genes presentes en >1% de genomas
  max_presence_percent: 99.0    # Genes presentes en <99% de genomas

# ============================================
# RANDOM FOREST
# ============================================
random_forest:
  # Parámetros del modelo
  n_trees: 1000                 # PAPER: 1000 árboles (máxima precisión)
  max_depth: 8                  # Profundidad máxima del árbol (paper:8)
  min_present: 1.0              # % mínimo de presencia
  min_absent: 1.0               # % mínimo de ausencia
  purity: null                  # null = usar max_depth para stopping

  # Paralelización
  n_threads: 32                 # Máxima paralelización (32 cores para velocidad óptima)
  
  # Multi-nodo (batch processing)
  n_batches: 10                 # Número de jobs paralelos (10 = ~10x speedup)

# ============================================
# NETWORK ANALYSIS
# ============================================
network:
  importance_threshold: 0.01    # Importancias < threshold --> 0

# ============================================
# FILTRADO DE RED (para clustering)
# ============================================
filtering:
  # Filtros según paper (genes predictable)
  d_threshold: 0.0              # D > 0 (dispersión no Browniana)
  f1_threshold: 0.9             # F1 > 0.9 en ambas clases
  error_threshold: 0.1          # Error < 0.1

# ============================================
# CLUSTERING
# ============================================
clustering:
  method: "louvain"             # Paper:Louvain
  edge_type: null               # null = ambos tipos de edges

# ============================================
# CONSTRUCCIÓN FILOGENÉTICA
# ============================================
phylogeny_build:
  method: "iqtree"              # Método para construir árbol
  model: "MFP"                  # Modelo evolutivo (MFP = auto-select)
  bootstrap: 1000               # Número de bootstraps
  threads: 32                   # Máxima paralelización

# ============================================
# ANÁLISIS FILOGENÉTICO (estadístico D)
# ============================================
phylogeny:
  skip: false              # true = saltar análisis D
  cores: 4                      # Cores paralelizar
  d_permutations: 1000          # Permutaciones para test D
  
  # Multi-nodo (batch processing for D statistic)
  n_batches: 10                 # Número de jobs paralelos (~10x speedup)

  # Filtros para calcular D (solo genes bien predichos)
  f1_threshold: 0.9             # F1 > 0.9 en ambas clases
  error_threshold: 0.1          # Error < 0.1

# ============================================
# OUTPUTS
# ============================================
outputs:
  generate_database: true       # Crear base de datos SQL
  generate_clusters: true       # Generar archivos por cluster
  generate_reports: false       # Generar informe HTML

# ============================================
# CASOS DE USO
# ============================================
#
#  TEST CON DESCARGA (pocos genomas):
#   download.assembly_levels: ["complete"]
#   download.max_genomes: 50
#   random_forest.n_trees: 100
#   phylogeny.skip: true
#
# PRODUCCIÓN (reproducir paper):
#   download.assembly_levels: ["complete"]
#   # Sin max_genomes descarga TODOS
#   random_forest.n_trees: 1000
#   phylogeny.skip: false
#   phylogeny_build.bootstrap: 1000
#   panaroo.threads: 16
#   random_forest.n_threads: 16
