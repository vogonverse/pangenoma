name: pangenoma_py
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python=3.9
  
  # Core scientific packages
  - pandas>=1.3
  - numpy>=1.21
  
  # Machine Learning
  - scikit-learn>=1.0
  
  # Network analysis
  - networkx>=2.6
  
  # Bioinformatics
  - biopython>=1.79
  
  # Visualization
  - matplotlib>=3.5
  - seaborn
  
  # Database
  - sqlite
  
  # Development tools (optional)
  - pylint
